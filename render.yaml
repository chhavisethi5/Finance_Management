services:
  - type: web
    name: finance-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate_add_investments.py && python migrate_add_is_past_to_investments.py && python migrate_rename_precious_metals_to_commodities.py && python migrate_add_risk_appetite_to_users.py && gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY
        sync: false
